  <script>
    function setStatus(topic, message, color) {
      const status = document.getElementById(topic + "-status");
      status.textContent = message;
      status.style.color = color;
    }

    function normaliseUrl(value) {
      const trimmed = value.trim();
      if (!trimmed) return null;
      const withProtocol = /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;

      try {
        const parsed = new URL(withProtocol);
        return parsed.protocol === "http:" || parsed.protocol === "https:" ? parsed.href : null;
      } catch (error) {
        return null;
      }
    }

    function launchGame(topic) {
      const input = document.getElementById(topic + "-url");
      const url = normaliseUrl(input.value);

      if (!input.value.trim()) {
        setStatus(topic, "請先貼上遊戲連結。", "#f46d43");
        input.focus();
        return;
      }

      if (!url) {
        setStatus(topic, "請輸入有效網址，例如 https://example.com", "#f46d43");
        input.focus();
        return;
      }

      window.open(url, "_blank", "noopener,noreferrer");
      setStatus(topic, "已在新分頁開啟遊戲！", "#248565");
    }

    function clearGame(topic) {
      const input = document.getElementById(topic + "-url");
      input.value = "";
      setStatus(topic, "連結已清除，可隨時加入新的遊戲網址。", "#164a84");
      input.focus();
    }

    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();
    });
  </script>
