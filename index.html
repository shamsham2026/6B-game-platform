  <script>
    let activeGame = "";
    let score = 0;
    let correctAnswer = 0;
    let optionAnswer = "";
    let roundLocked = false;

    const gameMeta = {
      decimal: { eyebrow: "運算任務", title: "小數四則運算", helper: "仔細對準小數點，算出正確答案！" },
      conversion: { eyebrow: "互化任務", title: "分數百分數互化", helper: "找出與題目相等的表示方法。" },
      average: { eyebrow: "統計任務", title: "平均數", helper: "把總數平均分配，找出平均值。" },
      circle: { eyebrow: "圖形任務", title: "圓周與圓面積", helper: "本關統一使用 π = 3.14。" },
      speed: { eyebrow: "生活任務", title: "速率", helper: "記住：速率 = 距離 ÷ 時間。" },
      equation: { eyebrow: "代數任務", title: "方程", helper: "找出讓等號兩邊相等的 x。" }
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function setScore(value) {
      score = value;
      document.getElementById("score-display").textContent = score;
    }

    function openGame(game) {
      activeGame = game;
      setScore(0);
      document.getElementById("library-view").classList.add("panel-hidden");
      document.getElementById("game-view").classList.remove("panel-hidden");
      document.getElementById("stage-eyebrow").textContent = gameMeta[game].eyebrow;
      document.getElementById("stage-title").textContent = gameMeta[game].title;
      document.getElementById("game-helper").textContent = gameMeta[game].helper;
      startRound();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function backToLibrary() {
      document.getElementById("game-view").classList.add("panel-hidden");
      document.getElementById("library-view").classList.remove("panel-hidden");
      activeGame = "";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setInputMode() {
      document.getElementById("answer-form").classList.remove("panel-hidden");
      document.getElementById("options-wrap").classList.add("panel-hidden");
      document.getElementById("answer-input").value = "";
      document.getElementById("answer-input").focus();
    }

    function setOptionMode(options, answer) {
      optionAnswer = String(answer);
      document.getElementById("answer-form").classList.add("panel-hidden");
      const wrap = document.getElementById("options-wrap");
      wrap.classList.remove("panel-hidden");
      const buttons = wrap.querySelectorAll("button");

      shuffle(options).forEach((option, index) => {
        buttons[index].textContent = option;
        buttons[index].disabled = false;
        buttons[index].classList.remove("is-correct", "is-wrong");
      });
    }

    function startRound() {
      roundLocked = false;
      document.getElementById("feedback").textContent = "";

      if (activeGame === "decimal") createDecimalQuestion();
      if (activeGame === "conversion") createConversionQuestion();
      if (activeGame === "average") createAverageQuestion();
      if (activeGame === "circle") createCircleQuestion();
      if (activeGame === "speed") createSpeedQuestion();
      if (activeGame === "equation") createEquationQuestion();
    }

    function createDecimalQuestion() {
      setInputMode();
      const type = randomInt(0, 3);
      let a, b, result, symbol;

      if (type === 0) {
        a = randomInt(12, 70) / 10;
        b = randomInt(11, 50) / 10;
        result = +(a + b).toFixed(1);
        symbol = "+";
      } else if (type === 1) {
        a = randomInt(50, 99) / 10;
        b = randomInt(11, 49) / 10;
        result = +(a - b).toFixed(1);
        symbol = "−";
      } else if (type === 2) {
        a = randomInt(12, 50) / 10;
        b = randomInt(2, 9);
        result = +(a * b).toFixed(1);
        symbol = "×";
      } else {
        b = randomInt(2, 9);
        result = randomInt(12, 80) / 10;
        a = +(b * result).toFixed(1);
        symbol = "÷";
      }

      correctAnswer = result;
      document.getElementById("question-box").textContent = a + " " + symbol + " " + b + " = ?";
    }

    function createConversionQuestion() {
      const questions = [
        { prompt: "0.25 等於哪一個數？", answer: "25%", options: ["25%", "2.5%", "1/4%", "250%"] },
        { prompt: "3/5 等於哪一個數？", answer: "60%", options: ["30%", "50%", "60%", "80%"] },
        { prompt: "75% 等於哪一個小數？", answer: "0.75", options: ["0.075", "0.75", "7.5", "0.25"] },
        { prompt: "0.4 等於哪一個分數？", answer: "2/5", options: ["1/5", "2/5", "3/5", "4/5"] },
        { prompt: "哪一個數最大？", answer: "0.8", options: ["75%", "3/4", "0.8", "7/10"] }
      ];
      const question = questions[randomInt(0, questions.length - 1)];
      document.getElementById("question-box").textContent = question.prompt;
      setOptionMode(question.options, question.answer);
    }

    function createAverageQuestion() {
      setInputMode();
      const average = randomInt(4, 15);
      const offsetA = randomInt(1, 4);
      const offsetB = randomInt(1, 4);
      const numbers = [average - offsetA, average - offsetB, average + offsetA, average + offsetB];
      correctAnswer = average;
      document.getElementById("question-box").textContent = "這四個數：" + numbers.join("、") + " 的平均數是多少？";
    }

    function createCircleQuestion() {
      setInputMode();
      const radius = randomInt(2, 8);
      const isArea = Math.random() > 0.5;
      correctAnswer = isArea ? +(3.14 * radius * radius).toFixed(2) : +(2 * 3.14 * radius).toFixed(2);
      document.getElementById("question-box").textContent = isArea
        ? "半徑是 " + radius + " 公分的圓，面積是多少平方公分？"
        : "半徑是 " + radius + " 公分的圓，圓周長是多少公分？";
    }

    function createSpeedQuestion() {
      setInputMode();
      const speed = randomInt(3, 12);
      const hours = randomInt(2, 6);
      const distance = speed * hours;
      correctAnswer = speed;
      document.getElementById("question-box").textContent = "小明走了 " + distance + " 公里，用了 " + hours + " 小時。他的速率是多少公里／小時？";
    }

    function createEquationQuestion() {
      setInputMode();
      const x = randomInt(3, 15);
      const multiplier = randomInt(2, 6);
      const addend = randomInt(3, 18);
      correctAnswer = x;
      document.getElementById("question-box").textContent = multiplier + " × x + " + addend + " = " + (multiplier * x + addend) + "，x = ?";
    }

    function showResult(isCorrect, selectedButton) {
      if (roundLocked) return;
      roundLocked = true;
      const feedback = document.getElementById("feedback");

      if (isCorrect) {
        feedback.textContent = "答對了！獲得 10 分！";
        feedback.style.color = "#248565";
        setScore(score + 10);
        if (selectedButton) selectedButton.classList.add("is-correct");
      } else {
        feedback.textContent = "再想一想，下一題一定會更好！";
        feedback.style.color = "#f46d43";
        if (selectedButton) selectedButton.classList.add("is-wrong");
      }

      document.querySelectorAll("#options-wrap button").forEach(button => {
        button.disabled = true;
        if (button.textContent === optionAnswer) button.classList.add("is-correct");
      });

      setTimeout(startRound, 1100);
    }

    document.getElementById("answer-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const input = document.getElementById("answer-input");

      if (input.value.trim() === "") {
        const feedback = document.getElementById("feedback");
        feedback.textContent = "先輸入你的答案吧！";
        feedback.style.color = "#f46d43";
        return;
      }

      const entered = Number(input.value);
      showResult(Math.abs(entered - correctAnswer) < 0.011);
    });

    function chooseOption(index) {
      const button = document.querySelectorAll("#options-wrap button")[index];
      showResult(button.textContent === optionAnswer, button);
    }

    document.addEventListener("DOMContentLoaded", function() {
      lucide.createIcons();
    });
  </script>
 </body>
</html>
